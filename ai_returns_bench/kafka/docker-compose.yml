version: "3.9"

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.11
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:19092,OUTSIDE://localhost:9092
      - --pandaproxy-addr
      - 0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - localhost:18082
    ports:
      - "9092:9092"
      - "19092:19092"
      - "18082:18082"
